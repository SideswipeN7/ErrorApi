name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore ErrorApi.slnx

      # Warnings matter here: the sample builds with the trim and AOT analyzers on, so a regression
      # in AOT compatibility fails the build rather than the README.
      - name: Build
        run: dotnet build ErrorApi.slnx --no-restore -c Release -warnaserror

      - name: Test
        run: dotnet test ErrorApi.slnx --no-build -c Release

      - name: Upload received snapshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: received-snapshots
          path: tests/**/Snapshots/*.received.txt
          if-no-files-found: ignore

      # nuget.org renders markdown only — no raw HTML, no SVG, no repo-relative paths — so the packaged
      # copy of each README swaps the local <img> header for a markdown image with an absolute PNG URL.
      # Rewriting here rather than in the checked-in files keeps the images working while browsing the
      # repository itself.
      - name: Prepare package READMEs
        shell: bash
        run: |
          # The root README backs the core packages; the adapters ship their own.
          sed -i '1s|.*logo\.svg.*|![ErrorApi](https://raw.githubusercontent.com/SideswipeN7/ErrorApi/main/docs/images/logo-mark.png)|' README.md
          for f in src/*/README.md; do
            sed -i '1s|.*logo\.svg.*|![ErrorApi](https://raw.githubusercontent.com/SideswipeN7/ErrorApi/main/docs/images/logo-mark.png)|' "$f"
          done

      - name: Pack
        run: dotnet pack ErrorApi.slnx --no-build -c Release -o artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts/*.nupkg

  # The request-path benchmarks, run per push so the numbers are tracked instead of being a one-off
  # local snapshot. Not a gate — shared-runner timings are too noisy for thresholds — but every run's
  # full BenchmarkDotNet output is kept as a workflow artifact, so a mapping-path regression has a
  # commit-by-commit paper trail. Only main pushes; PRs skip the ~5 minutes.
  benchmarks:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Run benchmarks
        run: dotnet run -c Release --project benchmarks/ErrorApi.Benchmarks

      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-${{ github.sha }}
          path: benchmarks/ErrorApi.Benchmarks/BenchmarkDotNet.Artifacts/results/*
          if-no-files-found: error

  # Each adapter is pinned to one version of its library, but has to keep working across the range
  # people actually have installed. The suites take a version override so this stays one job per pair.
  adapters:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - adapter: ErrorOr
            property: ErrorOrTestVersion
            version: '1.10.0'
          - adapter: ErrorOr
            property: ErrorOrTestVersion
            version: '2.0.1'
          - adapter: ErrorOr
            property: ErrorOrTestVersion
            version: '2.1.1'
          - adapter: OneOf
            property: OneOfTestVersion
            version: '3.0.263'
          - adapter: OneOf
            property: OneOfTestVersion
            version: '3.0.271'
          - adapter: LanguageExt
            property: LanguageExtTestVersion
            version: '4.4.0'
          - adapter: LanguageExt
            property: LanguageExtTestVersion
            version: '4.4.9'
          - adapter: FluentResults
            property: FluentResultsTestVersion
            version: '3.15.0'
          - adapter: FluentResults
            property: FluentResultsTestVersion
            version: '3.16.0'
          - adapter: ArdalisResult
            property: ArdalisResultTestVersion
            version: '9.1.0'
          - adapter: ArdalisResult
            property: ArdalisResultTestVersion
            version: '10.1.0'
          - adapter: CSharpFunctionalExtensions
            property: CfeTestVersion
            version: '3.4.3'
          - adapter: CSharpFunctionalExtensions
            property: CfeTestVersion
            version: '3.7.0'
          - adapter: LanguageExt.V5
            property: LanguageExtV5TestVersion
            version: '5.0.0-beta-77'
    name: ${{ matrix.adapter }} ${{ matrix.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Test
        run: >
          dotnet test tests/ErrorApi.${{ matrix.adapter }}.Tests
          -c Release
          -p:${{ matrix.property }}=${{ matrix.version }}
