name: release

# The maintainer-only release job: on a public repository, workflow_dispatch can only be triggered by
# users with write access — outsiders can read this file but never run it. One run does the whole
# release: full build + tests as the gate, then tag, GitHub release and nuget.org push.
#
# Publishing uses nuget.org Trusted Publishing (OIDC): the NuGet/login step exchanges this workflow's
# identity for a short-lived API key, so no NUGET_API_KEY secret exists. The trust policy lives on
# nuget.org (profile → Trusted Publishing: SideswipeN7/ErrorApi, workflow release.yml).
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. 0.1.0. Applied as VersionPrefix — ErrorApi.LanguageExt.V5 appends its own -beta suffix.'
        required: true
        type: string
      dry_run:
        description: 'Build, test and pack only — no tag, no GitHub release, no nuget.org push.'
        type: boolean
        default: true

permissions:
  contents: write
  id-token: write # OIDC token for nuget.org Trusted Publishing

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'SideswipeN7/ErrorApi'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate the version
        run: |
          if ! [[ "${{ inputs.version }}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version '${{ inputs.version }}' is not plain X.Y.Z — prerelease suffixes belong to the projects, not the input."
            exit 1
          fi
          if git rev-parse "v${{ inputs.version }}" >/dev/null 2>&1; then
            echo "::error::Tag v${{ inputs.version }} already exists."
            exit 1
          fi

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore ErrorApi.slnx

      # The release gate is the full quality bar, not a shortcut: warning-free build, every suite.
      - name: Build
        run: dotnet build ErrorApi.slnx --no-restore -c Release -warnaserror -p:VersionPrefix=${{ inputs.version }}

      - name: Test
        run: dotnet test ErrorApi.slnx --no-build -c Release -p:VersionPrefix=${{ inputs.version }}

      # nuget.org renders markdown only — same rewrite the ci workflow applies before packing.
      - name: Prepare package READMEs
        run: |
          sed -i '1s|.*logo\.svg.*|![ErrorApi](https://raw.githubusercontent.com/SideswipeN7/ErrorApi/main/docs/images/logo-mark.png)|' README.md
          for f in src/*/README.md; do
            sed -i '1s|.*logo\.svg.*|![ErrorApi](https://raw.githubusercontent.com/SideswipeN7/ErrorApi/main/docs/images/logo-mark.png)|' "$f"
          done

      - name: Pack
        run: dotnet pack ErrorApi.slnx --no-build -c Release -p:VersionPrefix=${{ inputs.version }} -o artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: packages-${{ inputs.version }}
          path: artifacts/*.nupkg

      - name: Log in to nuget.org (Trusted Publishing)
        if: ${{ !inputs.dry_run }}
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: FiloMortis

      - name: Push to nuget.org
        if: ${{ !inputs.dry_run }}
        run: >
          dotnet nuget push "artifacts/*.nupkg"
          --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      - name: Tag and create the GitHub release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "v${{ inputs.version }}" "${{ github.sha }}"
          git push origin "v${{ inputs.version }}"
          gh release create "v${{ inputs.version }}" artifacts/*.nupkg --generate-notes --title "v${{ inputs.version }}"
